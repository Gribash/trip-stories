<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
<title>Наше путешествие</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#f6f1e8;--paper:#fffdf8;--fg:#24201b;--mut:#7c7266;--line:#e4dccd;--red:#9b2d20;--ochre:#c08a2e;--box:#efe6d6;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"PT Serif",Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17140f;--paper:#1f1b15;--fg:#efe7da;--mut:#a3988a;--line:#3a332a;--red:#d2654f;--ochre:#d9a54a;--box:#2a241c}}
:root[data-theme="dark"]{--bg:#17140f;--paper:#1f1b15;--fg:#efe7da;--mut:#a3988a;--line:#3a332a;--red:#d2654f;--ochre:#d9a54a;--box:#2a241c}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.62 var(--serif);-webkit-text-size-adjust:100%}
a{color:var(--red)}
.hero{position:relative;min-height:92vh;display:flex;align-items:flex-end;color:#fff;overflow:hidden}
.hero-img{position:absolute;inset:0;background-size:cover;background-position:center 40%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 35%,rgba(0,0,0,.72))}
.hero .in{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:0 20px 48px;width:100%}
.hero h1{font-size:clamp(44px,11vw,84px);line-height:1;margin:0 0 10px;letter-spacing:-.01em;font-weight:600}
.hero .sub{font-size:clamp(19px,4.6vw,24px);margin:0 0 14px;opacity:.95}
.hero .date{font:600 13px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;opacity:.85}
main{max-width:760px;margin:0 auto;padding:0 20px 80px}
.lead{font-size:21px;line-height:1.55;margin:40px 0 8px}
nav.toc{display:flex;flex-wrap:wrap;gap:6px 8px;margin:28px 0 8px;font:14px/1.3 var(--sans)}
nav.toc a{text-decoration:none;color:var(--fg);background:var(--paper);border:1px solid var(--line);padding:6px 10px;border-radius:999px}
nav.toc a b{color:var(--red);font-variant-numeric:tabular-nums;margin-right:2px}
.chapter{margin-top:72px}
.chead{display:flex;align-items:baseline;gap:14px;border-top:2px solid var(--red);padding-top:14px}
.chead .num{font:600 15px/1 var(--sans);color:var(--red);letter-spacing:.06em}
h2{font-size:clamp(28px,6.4vw,38px);line-height:1.12;margin:0;font-weight:600}
h3{font:600 15px/1.3 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--red);margin:0 0 8px}
.chead + p{margin-top:20px}
p.when{font:13px/1.4 var(--sans);color:var(--mut);margin:8px 0 22px;letter-spacing:.02em}
p{margin:0 0 18px}
blockquote{margin:32px 0;padding:0 0 0 20px;border-left:3px solid var(--ochre);font-size:23px;line-height:1.45;font-style:italic}
figure{margin:26px 0}
figcaption,.cap-s{font:14.5px/1.45 var(--sans);color:var(--mut);margin-top:8px}
.cap-s{margin-top:-14px}
figure img,figure video{display:block;width:100%;height:auto;border-radius:6px;background:var(--box);cursor:zoom-in}
figure video{cursor:auto}
.wide{margin-left:-20px;margin-right:-20px}
.wide figcaption{padding:0 20px}
@media (min-width:900px){.wide{margin-left:-120px;margin-right:-120px}.wide figcaption{padding:0 120px}}
figure.full{margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw)}
figure.full img{border-radius:0;max-height:92vh;object-fit:cover}
figure.full figcaption{max-width:760px;margin:8px auto 0;padding:0 20px}
figure.ph:not(.full):not(.ext) img{max-height:86vh;object-fit:contain;background:transparent}
.row .imgs{display:grid;gap:6px}
.row.r2 .imgs{grid-template-columns:1fr 1fr}
.row.r3 .imgs{grid-template-columns:1fr 1fr 1fr}
.row img{aspect-ratio:3/4;object-fit:cover;height:100%}
.gallery .imgs{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;padding:0 20px 6px;scrollbar-width:thin}
.gallery img{flex:0 0 auto;width:min(68vw,320px);aspect-ratio:3/4;object-fit:cover;scroll-snap-align:center}
.vid video{max-height:80vh;background:#000;object-fit:contain}
.vid.vert video{margin:0 auto}
.tag{display:inline-block;font:600 12px/1 var(--sans);background:var(--red);color:#fff;padding:3px 6px;border-radius:4px;margin-right:4px;vertical-align:1px}
.credit{display:block;font-size:12px;opacity:.8;margin-top:2px}
.compare .imgs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media (max-width:600px){.compare .imgs{grid-template-columns:1fr}}
.compare .imgs div{position:relative}
.compare img{aspect-ratio:4/3;object-fit:cover}
.compare .imgs span{position:absolute;left:8px;top:8px;font:600 11px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;background:rgba(0,0,0,.6);color:#fff;padding:4px 7px;border-radius:4px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:30px 0}
.facts div{background:var(--paper);padding:16px 14px}
.facts b{display:block;font-size:30px;line-height:1.05;color:var(--red);font-weight:600;margin-bottom:4px}
.facts span{display:block;font:14px/1.35 var(--sans);color:var(--mut)}
aside.box{background:var(--box);border-radius:10px;padding:20px 20px 4px;margin:30px 0;font-size:16.5px;line-height:1.55}
#map{border-radius:8px;border:1px solid var(--line);margin-top:26px;margin-bottom:22px;z-index:0;overflow:hidden}
#map{overflow-x:auto;-webkit-overflow-scrolling:touch}
#map img{display:block;width:100%;height:auto}
@media (max-width:700px){#map img{width:820px;max-width:none}}
#map.live{height:min(70vh,520px)}
.nojs{font:14px/1.45 var(--sans);background:var(--box);border-radius:8px;padding:12px 14px;margin:24px 0 0}
.leaflet-container{font-family:var(--sans)}
.chn{background:var(--red);color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font:600 12px/1 var(--sans);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
footer{max-width:760px;margin:0 auto;padding:30px 20px 60px;font:13px/1.5 var(--sans);color:var(--mut);border-top:1px solid var(--line)}
#lb{position:fixed;inset:0;background:rgba(10,8,6,.95);z-index:3000;display:none;flex-direction:column;align-items:center;justify-content:center}
#lb.on{display:flex}
#lb img{max-width:100vw;max-height:84vh;object-fit:contain}
#lb .c{color:#ddd;font:14px/1.45 var(--sans);max-width:720px;padding:12px 16px;text-align:center}
#lb .x{position:absolute;z-index:2;top:8px;right:12px;color:#fff;font:32px/1 var(--sans);background:none;border:0;cursor:pointer;padding:8px}
#lb .nv{position:absolute;top:0;bottom:0;width:22%;cursor:pointer}
#lb .l{left:0}#lb .r{right:0}
@supports (height:1svh){.hero{min-height:92svh}figure.full img{max-height:92svh}figure.ph:not(.full):not(.ext) img{max-height:86svh}.vid video{max-height:80svh}#map.live{height:min(70svh,520px)}#lb img{max-height:84svh}}
</style>
<style>
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:var(--sans)}
#gate form{max-width:340px;width:100%;text-align:center}
#gate h1{font:600 26px/1.2 var(--serif);margin:0 0 14px}
#gate input{width:100%;font:18px var(--sans);padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--fg)}
#gate button{margin-top:12px;width:100%;font:600 17px var(--sans);padding:12px;border:0;border-radius:10px;background:var(--red);color:#fff}
#gate .err{color:var(--red);font-size:14px;min-height:20px;margin-top:10px}
#gate .wait{color:var(--mut);font-size:15px}
img[data-esrc]:not([src]){background:var(--box)}
</style></head><body>
<div id="gate"><form><h1>Наше путешествие</h1><p class="wait" id="wait">Открываем…</p>
<div id="ask" hidden><input type="password" autocomplete="current-password" placeholder="Пароль из сообщения"><button>Открыть</button><div class="err"></div></div></form></div>
<div id="app"></div>
<script>
const SALT='9aa196e0c0a32a98f1a9a89eb99bd184', ITER=200000;
let KEY;
const hex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
async function derive(p){const b=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:hex(SALT),iterations:ITER,hash:'SHA-256'},b,{name:'AES-CBC',length:256},false,['decrypt'])}
async function dec(url){const r=await fetch(url);if(!r.ok)throw new Error(r.status);const b=new Uint8Array(await r.arrayBuffer());
  return crypto.subtle.decrypt({name:'AES-CBC',iv:b.slice(0,16)},KEY,b.slice(16))}
const done=new WeakMap();let active=0;const queue=[];
function slot(){return new Promise(r=>{if(active<4){active++;r()}else queue.push(r)})}
function free(){const n=queue.shift();if(n)n();else active--}
function ensure(el){if(done.has(el))return done.get(el);const p=slot().then(()=>ensure0(el)).finally(free);done.set(el,p);return p}
function ensure0(el){
  const jobs=[];
  if(el.dataset.esrc)jobs.push(dec(el.dataset.esrc).then(d=>{el.src=URL.createObjectURL(new Blob([d],{type:el.tagName==='VIDEO'?'video/mp4':'image/jpeg'}))}));
  if(el.dataset.eposter)jobs.push(dec(el.dataset.eposter).then(d=>{el.poster=URL.createObjectURL(new Blob([d],{type:'image/jpeg'}))}));
  if(el.dataset.ebg)jobs.push(dec(el.dataset.ebg).then(d=>{el.style.backgroundImage='url('+URL.createObjectURL(new Blob([d],{type:'image/jpeg'}))+')'}));
  return Promise.all(jobs).catch(()=>{})}
async function unlock(p){KEY=await derive(p);
  const data=JSON.parse(new TextDecoder().decode(await dec('payload.bin?v=6a81f0b51c76')));
  try{localStorage.setItem('trip-p',p)}catch(e){}
  document.title=data.title;document.getElementById('gate').remove();
  document.getElementById('app').outerHTML=data.body;window.__MAP=data.map;
  const els=[...document.querySelectorAll('[data-esrc],[data-eposter],[data-ebg]')];
  els.filter(e=>e.dataset.ebg||(e.closest('#map')&&!window.L)).forEach(ensure);
  if('IntersectionObserver' in window){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);ensure(e.target)}}),{rootMargin:'1200px 0px'});els.forEach(e=>io.observe(e))}
  else els.forEach(ensure);
  app();if(location.hash.length>1){const h=decodeURIComponent(location.hash.slice(1));if(!h.startsWith('p='))document.getElementById(h)?.scrollIntoView()}}
function ask(msg){document.getElementById('wait').hidden=true;const a=document.getElementById('ask');a.hidden=false;a.querySelector('.err').textContent=msg||'';a.querySelector('input').focus()}
document.querySelector('#gate form').addEventListener('submit',e=>{e.preventDefault();const v=document.querySelector('#ask input').value.trim();
  document.getElementById('wait').hidden=false;unlock(v).catch(()=>ask('Пароль не подошёл'))});
(function(){let p=null;const m=location.hash.match(/[#&]p=([^&]+)/);if(m)p=decodeURIComponent(m[1]);
  if(!p)try{p=localStorage.getItem('trip-p')}catch(e){}
  if(!window.crypto||!crypto.subtle){document.getElementById('wait').textContent='Этот браузер слишком старый, откройте ссылку в Chrome или Safari.';return}
  if(p)unlock(p).catch(()=>ask(m?'Ссылка не подошла, введите пароль':''));else ask()})();
function app(){
const MAP=window.__MAP;
if(window.L&&document.getElementById('map')&&MAP.route.length){
  const el=document.getElementById('map');el.innerHTML='';el.classList.add('live');
  const m=L.map('map',{scrollWheelZoom:false,tap:true});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(m);
  const line=L.polyline(MAP.route,{color:'#9b2d20',weight:3,opacity:.75}).addTo(m);
  MAP.ch.forEach(c=>{L.marker(c.pt,{icon:L.divIcon({className:'',html:'<div class="chn">'+c.n+'</div>',iconSize:[26,26],iconAnchor:[13,13]})})
    .addTo(m).bindPopup('<b>'+c.n+'.</b> <a href="#'+c.id+'">'+c.title+'</a>')});
  m.fitBounds(line.getBounds(),{padding:[16,16]});
}
// видео внутри файла (data:) iPhone в Safari играет надёжнее как blob
document.querySelectorAll('video[src^="data:"]').forEach(v=>{fetch(v.src).then(r=>r.blob()).then(b=>{v.src=URL.createObjectURL(b)}).catch(()=>{})});
const imgs=[...document.querySelectorAll('main figure img')];let k=0;const lb=document.getElementById('lb'),li=lb.querySelector('img'),lc=lb.querySelector('.c');
function show(i){k=(i+imgs.length)%imgs.length;const im=imgs[k];li.removeAttribute('src');ensure(im).then(()=>{li.src=im.currentSrc||im.src});const cp=im.dataset.cap||'';lc.textContent=(im.dataset.t&&!/^\d{1,2}:\d\d/.test(cp)?im.dataset.t+' · ':'')+cp;lb.classList.add('on')}
imgs.forEach((im,i)=>im.addEventListener('click',()=>show(i)));
lb.querySelector('.x').onclick=()=>lb.classList.remove('on');lb.querySelector('.l').onclick=()=>show(k-1);lb.querySelector('.r').onclick=()=>show(k+1);
li.onclick=()=>lb.classList.remove('on');
document.addEventListener('keydown',e=>{if(!lb.classList.contains('on'))return;if(e.key==='Escape')lb.classList.remove('on');if(e.key==='ArrowLeft')show(k-1);if(e.key==='ArrowRight')show(k+1)});
let sx=0;lb.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});lb.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)show(k+(d<0?1:-1))});

}
</script>
</body></html>
